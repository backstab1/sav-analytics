<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Signal logo variations</title>
  <desc id="desc">Six refinements of the Signal logo direction shown at display and navigation sizes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="13" flood-color="#000" flood-opacity=".07"/></filter>
    <mask id="cut-mask"><rect width="64" height="64" fill="white"/><path d="m6 41 52-18" stroke="black" stroke-width="11" stroke-linecap="round"/></mask>
    <symbol id="a" viewBox="0 0 64 64"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 20 32 6l17 14M15 44l17 14 17-14" stroke="#1D1D1F" stroke-width="6"/><path d="m8 40 48-16" stroke="#1D7A4F" stroke-width="7"/></g></symbol>
    <symbol id="b" viewBox="0 0 64 64"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 19 32 6l18 13M14 45l18 13 18-13" stroke="#1D1D1F" stroke-width="5"/><path d="m8 39 48-14" stroke="#1D7A4F" stroke-width="5"/></g></symbol>
    <symbol id="c" viewBox="0 0 64 64"><g fill="none" stroke="#1D1D1F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" mask="url(#cut-mask)"><path d="M14 20 32 5l18 15M14 44l18 15 18-15"/></g><path d="m7 41 50-18" fill="none" stroke="#1D7A4F" stroke-width="7" stroke-linecap="round"/></symbol>
    <symbol id="d" viewBox="0 0 64 64"><path d="M10 21 32 3l22 18-6 7-16-13-16 13-6-7ZM10 43l22 18 22-18-6-7-16 13-16-13-6 7Z" fill="#1D1D1F"/><path d="m6 39 50-18 3 9L9 48l-3-9Z" fill="#1D7A4F"/></symbol>
    <symbol id="e" viewBox="0 0 64 64"><rect x="3" y="3" width="58" height="58" rx="17" fill="#E8F4EE"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 22 32 10l16 12M16 42l16 12 16-12" stroke="#1D1D1F" stroke-width="5"/><path d="m11 39 42-14" stroke="#1D7A4F" stroke-width="6"/></g></symbol>
    <symbol id="f" viewBox="0 0 64 64"><g fill="none" stroke="#1D7A4F" stroke-linecap="round" stroke-linejoin="round"><path d="M15 20 32 6l17 14M15 44l17 14 17-14" stroke-width="6"/><path d="m8 40 48-16" stroke-width="7"/></g></symbol>
    <style>.h1{font:800 34px Inter,Arial,sans-serif;letter-spacing:-1px;fill:#1D1D1F}.sub{font:400 16px Inter,Arial,sans-serif;fill:#86868B}.name{font:700 18px Inter,Arial,sans-serif;fill:#1D1D1F}.note{font:400 13px Inter,Arial,sans-serif;fill:#86868B}.word{font:700 18px Inter,Arial,sans-serif;letter-spacing:-.4px;fill:#1D1D1F}.brand{fill:#1D7A4F}.label{font:600 12px Inter,Arial,sans-serif;letter-spacing:1.2px;fill:#86868B}</style>
  </defs>
  <rect width="1280" height="800" fill="#FAFAFA"/>
  <text class="h1" x="64" y="68">Signal — refinement round</text>
  <text class="sub" x="64" y="99">Одна идея, шесть характеров · главный тест — ясность на 25 px</text>

  <g transform="translate(64 140)"><g filter="url(#shadow)"><rect width="354" height="248" rx="22" fill="#FFF"/></g><use href="#a" x="28" y="28" width="112" height="112"/><text class="name" x="166" y="61">A · Ascend</text><text class="note" x="166" y="88">Самый близкий к исходнику,</text><text class="note" x="166" y="108">но диагональ теперь растёт.</text><use href="#a" x="28" y="184" width="25" height="25"/><text class="word" x="64" y="204">sav<tspan class="brand">analytics</tspan></text></g>
  <g transform="translate(463 140)"><g filter="url(#shadow)"><rect width="354" height="248" rx="22" fill="#FFF"/></g><use href="#b" x="28" y="28" width="112" height="112"/><text class="name" x="166" y="61">B · Balanced</text><text class="note" x="166" y="88">Легче и спокойнее.</text><text class="note" x="166" y="108">Лучше дружит с тонким UI.</text><use href="#b" x="28" y="184" width="25" height="25"/><text class="word" x="64" y="204">sav<tspan class="brand">analytics</tspan></text></g>
  <g transform="translate(862 140)"><g filter="url(#shadow)"><rect width="354" height="248" rx="22" fill="#FFF"/></g><use href="#c" x="28" y="28" width="112" height="112"/><text class="name" x="166" y="61">C · Cut</text><text class="note" x="166" y="88">Больше контраста и воздуха</text><text class="note" x="166" y="108">в местах пересечения.</text><use href="#c" x="28" y="184" width="25" height="25"/><text class="word" x="64" y="204">sav<tspan class="brand">analytics</tspan></text></g>

  <g transform="translate(64 426)"><g filter="url(#shadow)"><rect width="354" height="248" rx="22" fill="#FFF"/></g><use href="#d" x="28" y="28" width="112" height="112"/><text class="name" x="166" y="61">D · Ribbon</text><text class="note" x="166" y="88">Плотный знак для аватара,</text><text class="note" x="166" y="108">стикера и app icon.</text><use href="#d" x="28" y="184" width="25" height="25"/><text class="word" x="64" y="204">sav<tspan class="brand">analytics</tspan></text></g>
  <g transform="translate(463 426)"><g filter="url(#shadow)"><rect width="354" height="248" rx="22" fill="#FFF"/></g><use href="#e" x="28" y="28" width="112" height="112"/><text class="name" x="166" y="61">E · Tile</text><text class="note" x="166" y="88">Мягкий контейнер из системы.</text><text class="note" x="166" y="108">Самый «продуктовый» вариант.</text><use href="#e" x="28" y="184" width="25" height="25"/><text class="word" x="64" y="204">sav<tspan class="brand">analytics</tspan></text></g>
  <g transform="translate(862 426)"><g filter="url(#shadow)"><rect width="354" height="248" rx="22" fill="#FFF"/></g><use href="#f" x="28" y="28" width="112" height="112"/><text class="name" x="166" y="61">F · Mono</text><text class="note" x="166" y="88">Одноцветная версия для</text><text class="note" x="166" y="108">печати и служебных мест.</text><use href="#f" x="28" y="184" width="25" height="25"/><text class="word" x="64" y="204">sav<tspan class="brand">analytics</tspan></text></g>
  <text class="label" x="64" y="736">РЕКОМЕНДАЦИЯ</text><text class="sub" x="190" y="736">A как основной знак · E как app icon · F как обязательная одноцветная версия</text>
</svg>
