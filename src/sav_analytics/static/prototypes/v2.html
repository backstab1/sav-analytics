<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sav-analytics — макет плотности v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ================================================================
   Макет v2 — те же токены, что в styles.css. Меняется только
   раскладка: один ярус хрома, рельс вместо вкладок, инспектор
   по высоте контента, настройки — лист, а не вкладка.
   ================================================================ */
:root{
  --c-bg:#fafafa; --c-surface:#fff; --c-surface-soft:#f5f5f7;
  --c-border:rgba(0,0,0,.08); --c-border-strong:rgba(0,0,0,.14);
  --c-ink:#1d1d1f; --c-ink-2:#494950; --c-ink-3:#86868b; --c-ink-4:#c7c7cc;
  --c-brand:#1d7a4f; --c-brand-hover:#166341; --c-brand-2:#2eae68; --c-brand-tint:#e8f4ee;
  --c-danger:#d64545; --c-danger-tint:#fbecec;
  --c-warn-ink:#9a6b00; --c-warn-tint:#fdf4dd;
  --r-1:8px; --r-2:12px; --r-3:18px; --r-pill:100px;
  --t-xs:12px; --t-sm:13px; --t-base:14.5px; --t-md:16px; --t-lg:19px; --t-xl:22px;
  --font-display:"Inter Tight",-apple-system,"SF Pro Display",Inter,sans-serif;
  --font-body:Inter,-apple-system,"SF Pro Text","Segoe UI",sans-serif;
  --focus-ring:0 0 0 3px rgba(29,122,79,.12);
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --shadow-panel:0 2px 8px rgba(0,0,0,.06),0 16px 48px rgba(0,0,0,.10);
  --ease:cubic-bezier(.25,.1,.25,1); --spring:cubic-bezier(.34,1.3,.5,1);
  /* Один ярус хрома вместо четырёх. */
  --bar:48px;
  --rail:196px;
  --insp:404px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--c-bg); color:var(--c-ink);
  font:var(--t-base)/1.45 var(--font-body);
  -webkit-font-smoothing:antialiased; font-synthesis:none;
  font-feature-settings:"cv05","cv08";
  overflow:hidden;               /* страница не скроллится — скроллят панели */
}
h1,h2,h3{margin:0;font-family:var(--font-display)}
h2{font-size:var(--t-lg);font-weight:700;letter-spacing:-.025em}
h3{font-size:var(--t-md);font-weight:700;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
code{padding:1px 5px;border-radius:5px;background:var(--c-brand-tint);color:var(--c-brand);
     font:600 11px/1.4 "SF Mono",Menlo,Consolas,monospace}
[hidden]{display:none!important}
::selection{background:var(--c-brand-tint)}

/* ---------- скроллбары ---------- */
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:transparent transparent}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-thumb{background:transparent;border:2px solid transparent;
  border-radius:var(--r-pill);background-clip:content-box}
.scroll:hover{scrollbar-color:var(--c-ink-4) transparent}
.scroll:hover::-webkit-scrollbar-thumb{background:var(--c-ink-4);background-clip:content-box}

/* ================================================================
   ЯРУС 1 — единственный. Бренд, проект, сводка, действия.
   Раньше это были appbar(54) + workspace-head(77) + panel-head(47).
   ================================================================ */
.bar{
  height:var(--bar); display:flex; align-items:center; gap:14px;
  padding:0 16px 0 18px;
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(1.8) blur(20px); -webkit-backdrop-filter:saturate(1.8) blur(20px);
  border-bottom:1px solid var(--c-border);
  position:relative; z-index:60;
}
.brand{display:flex;align-items:center;gap:8px;color:var(--c-ink);text-decoration:none;
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.02em;flex:0 0 auto}
.brand svg{width:23px;height:23px}
.brand span{color:var(--c-brand)}
.bar-sep{width:1px;height:18px;background:var(--c-border-strong);flex:0 0 auto}

/* Проект — не заголовок H1 на 77px, а переключатель в шапке. */
.project{
  display:flex;align-items:center;gap:8px;min-width:0;max-width:300px;
  padding:5px 10px 5px 11px;border-radius:9px;color:var(--c-ink);
  transition:background 140ms var(--ease)}
.project:hover{background:var(--c-surface-soft)}
.project b{font-family:var(--font-display);font-weight:700;font-size:var(--t-base);
  letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project svg{width:11px;height:11px;color:var(--c-ink-3);flex:0 0 auto}

/* Сводка — чипы в строку вместо четырёх карточек 100×56 */
.stats{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden}
.chip{
  display:inline-flex;align-items:baseline;gap:6px;flex:0 0 auto;
  padding:5px 11px;border-radius:var(--r-pill);color:var(--c-ink-2);
  font-size:var(--t-xs);font-weight:500;white-space:nowrap;
  transition:background 140ms var(--ease),box-shadow 140ms var(--ease)}
.chip b{font-family:var(--font-display);font-weight:700;font-size:var(--t-sm);
  color:var(--c-ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip:hover{background:var(--c-surface-soft)}
.chip.active{background:var(--c-brand-tint);color:var(--c-brand)}
.chip.active b{color:var(--c-brand)}
.chip.warn b{color:var(--c-warn-ink)}
.chip.warn.active{background:var(--c-warn-tint);color:var(--c-warn-ink)}
.bar-grow{flex:1 1 auto;min-width:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:7px 15px;border-radius:var(--r-pill);background:var(--c-brand);color:#fff;
  font-size:var(--t-sm);font-weight:600;letter-spacing:-.005em;white-space:nowrap;
  transition:background 160ms var(--ease),transform 120ms var(--ease)}
.btn:hover{background:var(--c-brand-hover)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn.quiet{background:var(--c-surface-soft);color:var(--c-ink)}
.btn.quiet:hover{background:#ececef}
.btn.ghost{background:transparent;color:var(--c-brand)}
.btn.ghost:hover{background:var(--c-brand-tint)}
.btn.danger{background:transparent;color:var(--c-danger);font-weight:500}
.btn.danger:hover{background:var(--c-danger-tint)}
.btn.sm{padding:6px 12px;font-size:var(--t-xs)}
.btn:focus-visible{outline:2px solid var(--c-brand);outline-offset:2px}

.iconbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;
  color:var(--c-ink-3);transition:background 140ms var(--ease),color 140ms var(--ease)}
.iconbtn:hover{background:var(--c-surface-soft);color:var(--c-ink)}
.iconbtn svg{width:17px;height:17px}
.avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  background:var(--c-brand-tint);color:var(--c-brand);font-size:11px;font-weight:700;flex:0 0 auto}

/* поповер выгрузки */
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 8px);right:0;min-width:236px;padding:6px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
  border:1px solid var(--c-border);border-radius:14px;box-shadow:var(--shadow-panel);
  z-index:80;animation:pop-in 160ms var(--ease)}
@keyframes pop-in{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pop a,.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;
  border-radius:9px;color:var(--c-ink);font-size:var(--t-sm);font-weight:500;text-align:left;
  text-decoration:none;transition:background 120ms var(--ease)}
.pop a:hover,.pop button:hover{background:var(--c-surface-soft)}
.pop svg{width:15px;height:15px;color:var(--c-ink-3);flex:0 0 auto}
.pop hr{height:1px;margin:5px 8px;border:0;background:var(--c-border)}

/* ================================================================
   ОБОЛОЧКА — рельс / список / инспектор
   ================================================================ */
.shell{
  height:calc(100dvh - var(--bar));
  display:grid; grid-template-columns:var(--rail) minmax(0,1fr);
  gap:12px; padding:12px 14px 14px;
}
.shell.has-insp{grid-template-columns:var(--rail) minmax(0,1fr) var(--insp)}

/* ---------- рельс: заменяет ряд вкладок внутри панели ---------- */
.rail{display:flex;flex-direction:column;gap:14px;min-height:0}
.rail-group{display:flex;flex-direction:column;gap:1px}
.rail-cap{padding:0 11px 6px;color:var(--c-ink-3);font-size:11px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase}
.rail-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
  color:var(--c-ink-2);font-size:var(--t-sm);font-weight:500;text-align:left;
  transition:background 140ms var(--ease),color 140ms var(--ease)}
.rail-item svg{width:16px;height:16px;flex:0 0 auto;color:var(--c-ink-3)}
.rail-item span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-item em{font-style:normal;font-size:var(--t-xs);font-weight:600;color:var(--c-ink-4);
  font-variant-numeric:tabular-nums}
.rail-item:hover{background:rgba(0,0,0,.035);color:var(--c-ink)}
.rail-item.active{background:var(--c-surface);color:var(--c-ink);font-weight:600;
  box-shadow:var(--shadow-card)}
.rail-item.active svg{color:var(--c-brand)}
.rail-item.active em{color:var(--c-brand)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:1px}

/* ---------- центральная панель ---------- */
.pane{background:var(--c-surface);border-radius:var(--r-3);box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:clip}
.pane-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:46px;
  padding:0 10px 0 18px;border-bottom:1px solid var(--c-border)}
.pane-bar h2{font-size:var(--t-md);letter-spacing:-.02em;flex:0 0 auto}
.pane-bar .count{color:var(--c-ink-3);font-size:var(--t-xs);font-weight:500;
  font-variant-numeric:tabular-nums}
.pane-body{flex:1 1 auto;min-height:0}

.search{position:relative;display:flex;align-items:center;min-width:0}
.search svg{position:absolute;left:10px;width:14px;height:14px;color:var(--c-ink-4);pointer-events:none}
.search input{width:clamp(150px,17vw,230px);padding:6px 11px 6px 30px;border-radius:9px;
  background:var(--c-surface-soft);border:1px solid transparent;font-size:var(--t-sm);outline:none;
  transition:background 140ms var(--ease),border-color 140ms var(--ease),box-shadow 140ms var(--ease)}
.search input:focus{background:var(--c-surface);border-color:var(--c-brand);box-shadow:var(--focus-ring)}

.seg{display:inline-flex;padding:2px;gap:2px;background:var(--c-surface-soft);border-radius:9px;flex:0 0 auto}
.seg button{padding:5px 13px;border-radius:7px;color:var(--c-ink-2);font-size:var(--t-sm);font-weight:500}
.seg button:hover{color:var(--c-ink)}
.seg button.active{background:var(--c-surface);color:var(--c-ink);font-weight:600;
  box-shadow:0 1px 1px rgba(0,0,0,.06),0 3px 8px rgba(0,0,0,.08)}

/* ---------- таблица структуры ---------- */
table{width:100%;border-collapse:collapse;font-size:var(--t-base)}
thead th{position:sticky;top:0;z-index:2;padding:8px 14px;text-align:left;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--c-border);
  color:var(--c-ink-3);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
tbody td{padding:0 14px;height:40px;border-bottom:1px solid var(--c-border);vertical-align:middle}
tbody tr{cursor:pointer;transition:background 120ms var(--ease)}
tbody tr:hover td{background:var(--c-surface-soft)}
tbody tr.sel td{background:var(--c-brand-tint)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--c-brand)}
tbody tr:last-child td{border-bottom:0}
.c-drag{width:28px;min-width:28px;padding:0;color:var(--c-ink-4);text-align:center;
  letter-spacing:-3px;font-weight:700;cursor:grab}
.c-code{width:104px}
.c-type{width:46px}
.c-n{width:78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--c-ink-2);font-size:var(--t-sm)}
.c-base{width:150px}
.c-state{width:118px}
/* Название больше не забирает 76% ширины: у него свой потолок. */
.c-title{max-width:0;width:100%}
.c-title b{display:block;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;
  background:var(--c-brand-tint);color:var(--c-brand)}
.tick svg{width:14px;height:14px}
.tick.mut{background:var(--c-surface-soft);color:var(--c-ink-3)}
.base-cell{display:inline-flex;align-items:center;gap:6px;color:var(--c-ink-2);font-size:var(--t-sm);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.base-cell.def{color:var(--c-ink-4)}
.state{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-sm);font-weight:500;
  color:var(--c-ink-2);white-space:nowrap}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-brand-2);flex:0 0 auto}
.state.review{color:var(--c-warn-ink)}.state.review::before{background:#e0a800}
.state.off{color:var(--c-ink-3)}.state.off::before{background:var(--c-ink-4)}

/* ---------- карточки сущностей: сетка, а не строки во всю ширину ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:10px;padding:14px}
.card{display:flex;flex-direction:column;gap:9px;padding:13px 15px;text-align:left;
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;color:var(--c-ink);
  transition:border-color 160ms var(--ease),box-shadow 160ms var(--ease)}
.card:hover{border-color:var(--c-border-strong);box-shadow:var(--shadow-card)}
.card.sel{border-color:var(--c-brand);box-shadow:inset 0 0 0 1px var(--c-brand)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.card-head b{min-width:0;font-family:var(--font-display);font-size:var(--t-base);font-weight:700;
  letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--c-ink-3);font-size:var(--t-xs)}
.card-meta b{color:var(--c-ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 9px;
  border-radius:var(--r-pill);background:var(--c-surface-soft);color:var(--c-ink-2);
  font-size:var(--t-xs);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags span.op{background:var(--c-brand-tint);color:var(--c-brand);font-weight:700}
.tags span.on{background:var(--c-brand-tint);color:var(--c-brand);font-weight:600}
.card.new{align-items:center;justify-content:center;gap:6px;min-height:104px;
  border-style:dashed;color:var(--c-ink-3);font-size:var(--t-sm);font-weight:600}
.card.new:hover{border-color:var(--c-brand);color:var(--c-brand);background:var(--c-brand-tint)}
.card.new svg{width:18px;height:18px}

/* ================================================================
   ИНСПЕКТОР — один компонент на все сущности.
   Высота по контенту, потолок — экран. Никакого --drawer-height.
   ================================================================ */
.insp{
  align-self:start;             /* ← ключевое: панель не тянется на весь экран */
  max-height:100%;
  display:flex;flex-direction:column;min-height:0;
  background:var(--c-surface);border-radius:var(--r-3);box-shadow:var(--shadow-panel);
  overflow:clip;animation:insp-in 220ms var(--ease)}
@keyframes insp-in{from{opacity:0;transform:translateX(12px)}}
.insp-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:11px 12px 11px 18px;border-bottom:1px solid var(--c-border)}
.insp-head .kicker{color:var(--c-brand);font-size:10px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:1px}
.insp-head h3{font-size:var(--t-md);letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-head > div{flex:1 1 auto;min-width:0}
.insp-body{flex:0 1 auto;min-height:0;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.insp-foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:11px 14px;border-top:1px solid var(--c-border);background:var(--c-surface)}
.insp-foot .grow{flex:1 1 auto}

/* поля — общая грамматика для всех инспекторов */
.f{display:grid;gap:5px;min-width:0}
.f > label{color:var(--c-ink-2);font-size:var(--t-xs);font-weight:600;letter-spacing:.01em}
.f > small{color:var(--c-ink-3);font-size:var(--t-xs);font-weight:500;line-height:1.35}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=number],select,textarea{
  width:100%;min-width:0;padding:7px 10px;border-radius:9px;
  background:var(--c-surface-soft);border:1px solid transparent;color:var(--c-ink);
  font-size:var(--t-sm);outline:none;
  transition:background 140ms var(--ease),border-color 140ms var(--ease),box-shadow 140ms var(--ease)}
input:focus,select:focus,textarea:focus{background:var(--c-surface);border-color:var(--c-brand);
  box-shadow:var(--focus-ring)}
textarea{resize:vertical;min-height:40px;line-height:1.4}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.sep{height:1px;background:var(--c-border);margin:1px 0}
.grp{display:grid;gap:9px}
.grp-cap{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.grp-cap strong{font-size:var(--t-sm);font-weight:600;letter-spacing:-.005em}
.grp-cap small{color:var(--c-ink-3);font-size:var(--t-xs)}

/* тумблер — как в проекте */
.tgl{position:relative;display:inline-flex;width:40px;height:24px;flex:0 0 auto;cursor:pointer}
.tgl input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.tgl .track{position:absolute;inset:0;border-radius:9px;background:#e7e7ea;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);transition:background 240ms var(--ease)}
.tgl .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:7px;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.10);display:grid;place-items:center;
  transition:transform 260ms var(--spring),border-radius 260ms var(--spring);pointer-events:none}
.tgl .knob svg{width:10px;height:10px;color:var(--c-brand);opacity:0;
  transform:scale(.4) rotate(-30deg);
  transition:opacity 180ms var(--ease),transform 260ms var(--spring)}
.tgl input:checked ~ .track{background:linear-gradient(135deg,var(--c-brand-2),var(--c-brand))}
.tgl input:checked ~ .knob{transform:translateX(16px);border-radius:9px}
.tgl input:checked ~ .knob svg{opacity:1;transform:none}
.tgl input:focus-visible ~ .track{outline:2px solid var(--c-brand);outline-offset:2px}
.tr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.tr > span:first-child{min-width:0}
.tr strong{display:block;font-size:var(--t-sm);font-weight:600;letter-spacing:-.005em}
.tr small{display:block;margin-top:1px;color:var(--c-ink-3);font-size:var(--t-xs);line-height:1.3}
.tr + .tr{border-top:1px solid var(--c-border)}
.tr.boxed{padding:7px 12px;background:var(--c-surface-soft);border-radius:10px}

/* строки-конструкторы (диапазоны, условия, блоки, цели) */
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:7px 8px 7px 11px;background:var(--c-surface-soft);border-radius:10px}
.row-main{display:grid;gap:4px;min-width:0}
.row-main b{font-size:var(--t-sm);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main small{color:var(--c-ink-3);font-size:var(--t-xs);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row-x{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;
  color:var(--c-ink-4);font-size:15px;line-height:1}
.row-x:hover{background:rgba(0,0,0,.06);color:var(--c-ink-2)}
.add{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px;border-radius:10px;
  border:1px dashed var(--c-border-strong);color:var(--c-ink-3);
  font-size:var(--t-xs);font-weight:600;transition:all 140ms var(--ease)}
.add:hover{border-color:var(--c-brand);color:var(--c-brand);background:var(--c-brand-tint)}

/* предпросмотр */
.prev{display:grid;gap:7px;padding:11px 12px;background:var(--c-surface-soft);border-radius:12px}
.prev-cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prev-cap strong{font-size:var(--t-sm);font-weight:600}
.prev-cap small{color:var(--c-ink-3);font-size:var(--t-xs);font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:1fr 34px;gap:9px;align-items:center;font-size:var(--t-xs)}
.bar-row > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--c-ink-2)}
.bar-row i{grid-column:1/-1;height:4px;margin-top:-4px;border-radius:3px;background:var(--c-brand);
  display:block}
.bar-row em{font-style:normal;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.metric{display:grid;gap:1px;padding:9px 10px;background:var(--c-surface);border-radius:10px}
.metric b{font-family:var(--font-display);font-size:var(--t-md);font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.metric span{color:var(--c-ink-3);font-size:11px}
.metric.ok b{color:var(--c-brand)}
.metric.warn b{color:var(--c-warn-ink)}

/* ================================================================
   ЛИСТ (sheet) — настройки отчёта и пропуски по анкете.
   Не вкладка: не обязан заполнять 1377px.
   ================================================================ */
.veil{position:fixed;inset:0;z-index:100;background:rgba(29,29,31,.28);
  backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;
  animation:veil-in 180ms var(--ease)}
@keyframes veil-in{from{opacity:0}}
.sheet{width:min(560px,100%);max-height:min(724px,calc(100dvh - 48px));
  display:flex;flex-direction:column;background:var(--c-surface);border-radius:20px;
  box-shadow:var(--shadow-panel);overflow:clip;animation:sheet-in 240ms var(--spring)}
.sheet.wide{width:min(620px,100%)}
@keyframes sheet-in{from{opacity:0;transform:translateY(14px) scale(.97)}}
.sheet-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:15px 14px 14px 20px;border-bottom:1px solid var(--c-border)}
.sheet-head > div{flex:1 1 auto;min-width:0}
.sheet-head h3{font-size:var(--t-lg);letter-spacing:-.025em}
.sheet-head small{display:block;margin-top:2px;color:var(--c-ink-3);font-size:var(--t-xs)}
.sheet-body{flex:1 1 auto;min-height:0;padding:14px 20px;display:flex;flex-direction:column;gap:11px}
.sheet-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;
  padding:12px 16px;border-top:1px solid var(--c-border);background:var(--c-surface-soft)}
.sheet-foot .grow{flex:1 1 auto;color:var(--c-ink-3);font-size:var(--t-xs)}
.sec-cap{display:flex;align-items:baseline;gap:8px;color:var(--c-ink-3);font-size:11px;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.sec-cap::after{content:"";flex:1 1 auto;height:1px;background:var(--c-border)}
.na-grp{display:grid;gap:7px;padding:11px 13px;background:var(--c-surface-soft);border-radius:12px}
.na-grp-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.na-grp-head strong{font-size:var(--t-sm);font-weight:600}
.na-grp-head small{color:var(--c-ink-3);font-size:var(--t-xs)}
.na-vars{display:flex;flex-wrap:wrap;gap:5px}
.na-vars code{font-size:10px}

/* ================================================================
   Замеры — оверлей, чтобы сравнение было не на глаз
   ================================================================ */
.ruler{position:fixed;left:0;right:0;top:0;height:var(--bar);z-index:95;pointer-events:none;
  border-bottom:2px dashed rgba(214,69,69,.55)}
.ruler::after{content:attr(data-label);position:absolute;right:12px;bottom:-24px;
  padding:3px 9px;border-radius:var(--r-pill);background:var(--c-danger);color:#fff;
  font-size:11px;font-weight:600;white-space:nowrap}
.meter{position:fixed;right:16px;bottom:16px;z-index:96;display:grid;gap:7px;
  min-width:262px;padding:13px 15px;border-radius:14px;
  background:rgba(29,29,31,.93);backdrop-filter:blur(16px);color:#fff;
  box-shadow:var(--shadow-panel);font-size:var(--t-xs);
  animation:sheet-in 240ms var(--spring)}
.meter h4{margin:0 0 1px;font-family:var(--font-display);font-size:var(--t-sm);font-weight:700}
.meter dl{display:grid;grid-template-columns:1fr auto auto;gap:5px 10px;margin:0;align-items:baseline}
.meter dt{color:rgba(255,255,255,.62)}
.meter dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.meter dd.was{color:rgba(255,255,255,.42);text-decoration:line-through}
.meter dd.now{font-weight:700;color:var(--c-brand-2)}
.meter-note{color:rgba(255,255,255,.5);line-height:1.4}

.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none}
.toast{padding:10px 20px;border-radius:var(--r-pill);background:rgba(29,29,31,.92);color:#fff;
  backdrop-filter:blur(16px);font-size:var(--t-sm);font-weight:500;box-shadow:var(--shadow-panel);
  animation:toast-in 300ms var(--spring)}
@keyframes toast-in{from{opacity:0;transform:translateY(12px) scale(.95)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
@media (max-width:1240px){
  :root{--rail:60px;--insp:360px}
  .rail-item span,.rail-item em,.rail-cap{display:none}
  .rail-item{justify-content:center;padding:9px}
}
</style>
</head>

<script>
/* ================================================================
   Данные — правдоподобная выборка, чтобы плотность читалась честно
   ================================================================ */
const ICON = {
  single:'<path d="M10 3.5 3.5 10 10 16.5 16.5 10 10 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  multi:'<path d="M4 6h12M4 10h12M4 14h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',

  open:'<path d="M4 5h12M4 9h12M4 13h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 2.6"/>',
  tech:'<circle cx="10" cy="10" r="6.2" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v3l2 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
};
const TYPE_RU = {single:'Один ответ',multi:'Множественный',scale:'Шкала',numeric:'Числовой',
                 matrix:'Матрица шкал',open:'Открытый текст',tech:'Технический'};

const QUESTIONS = [
 {c:'S1', t:'Пол респондента', k:'single', n:2, base:null, st:'ok'},
 {c:'S2', t:'Возраст, полных лет', k:'numeric', n:'—', base:null, st:'ok'},

 {c:'Q1', t:'Какие бренды категории вы знаете? (спонтанное знание)', k:'multi', n:14, base:null, st:'ok'},
 {c:'Q2', t:'Какие из этих брендов вам знакомы? (знание с подсказкой)', k:'multi', n:14, base:null, st:'ok'},
 {c:'Q3', t:'Каким брендом вы пользуетесь чаще всего?', k:'single', n:5, base:'Знающие категорию', st:'ok'},
 {c:'Q4', t:'Насколько вероятно, что вы порекомендуете бренд? (0–10)', k:'scale', n:11, base:'Пользователи бренда', st:'ok'},
 {c:'Q5', t:'Оцените бренд по каждому из параметров', k:'matrix', n:'9×5', base:'Пользователи бренда', st:'review'},
 {c:'Q6', t:'Что повлияло на выбор бренда?', k:'multi', n:11, base:'Пользователи бренда', st:'ok'},
 {c:'Q7', t:'Как часто вы покупаете продукты категории?', k:'single', n:6, base:null, st:'ok'},
 {c:'Q8', t:'Средний чек за одну покупку, руб.', k:'numeric', n:'—', base:'Покупатели за 3 мес.', st:'ok'},
 {c:'Q9', t:'Откуда вы узнаёте о новинках категории?', k:'multi', n:9, base:null, st:'ok'},
 {c:'Q10', t:'Удовлетворённость обслуживанием (1–5)', k:'scale', n:5, base:'Обращавшиеся в поддержку', st:'ok'},
 {c:'Q11', t:'Что бы вы улучшили в продукте?', k:'open', n:'—', base:null, st:'off'},
 {c:'Q12', t:'Планируете ли покупку в ближайшие 3 месяца?', k:'single', n:5, base:null, st:'ok'},
 {c:'Q13', t:'Знакомы ли вам эти рекламные материалы?', k:'multi', n:6, base:null, st:'review'},
 {c:'D1', t:'Уровень дохода семьи', k:'single', n:6, base:null, st:'ok'},
 {c:'D2', t:'Размер домохозяйства', k:'numeric', n:'—', base:null, st:'ok'},
 {c:'WAVE', t:'Волна исследования', k:'tech', n:4, base:null, st:'off'},
 {c:'ID', t:'Идентификатор респондента', k:'tech', n:'—', base:null, st:'off'}
];

const RECODINGS = [
 {c:'AGE_GRP', t:'Возрастные группы', src:'S2 · Возраст', mode:'Числовые диапазоны', n:4,
  tags:['18–24','25–34','35–44','45+']},
 {c:'INC_GRP', t:'Доход — укрупнённо', src:'D1 · Доход', mode:'Объединение категорий', n:3,
  tags:['Низкий','Средний','Высокий']},
 {c:'NPS_GRP', t:'NPS-группы', src:'Q4 · Рекомендация', mode:'Числовые диапазоны', n:3,
  tags:['Критики 0–6','Нейтралы 7–8','Промоутеры 9–10']}
];

const BANNERS = [
 {t:'Основной баннер', cols:11, blocks:3, active:true,
  tags:['Пол','Возрастные группы','Тип НП']},
 {t:'Социально-демо расширенный', cols:17, blocks:4, active:false,
  tags:['Пол','Возраст','Доход','Округ']},
 {t:'По пользованию', cols:7, blocks:2, active:false,
  tags:['Бренд использования','NPS-группы']}
];

const FILTERS = [
 {t:'Знающие категорию', n:1284, pct:92.1, tags:['Q2 ≠ «Ничего из перечисленного»']},
 {t:'Пользователи бренда', n:731, pct:52.4, tags:['Q3 ∈ {1,2,3}','И','Q7 ≠ «Не покупаю»']},
 {t:'Покупатели за 3 мес.', n:658, pct:47.2, tags:['Q7 ∈ {1,2,3,4}']},
 {t:'Обращавшиеся в поддержку', n:212, pct:15.2, tags:['Q10 не пусто']}
];

const WEIGHTS = [
 {t:'Вес по полу и возрасту', dims:2, eff:0.94, range:'0.41 – 2.18', iter:6, ok:true,
  tags:['Пол × 2','Возрастные группы × 4']},
 {t:'Вес по региону', dims:1, eff:0.88, range:'0.32 – 2.91', iter:9, ok:true,
  tags:['Федеральный округ × 8']}
];

const STATS = [
 {k:'n', v:'1 394', l:'респондентов'},
 {k:'q', v:'21', l:'вопрос'},
 {k:'inc', v:'17', l:'в отчёте'},
 {k:'rev', v:'2', l:'к проверке', warn:true}
];

const SECTIONS = [
 {id:'structure', label:'Структура', n:21, icon:'<path d="M3.5 5h13M3.5 10h13M3.5 15h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'},
 {id:'recodings', label:'Перекодировки', n:3, icon:'<path d="M4 7h8l-2.4-2.4M16 13H8l2.4 2.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'},
 {id:'banners', label:'Баннеры', n:3, icon:'<rect x="3.5" y="4.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5v11M12.5 4.5v11" stroke="currentColor" stroke-width="1.4"/>'},
 {id:'filters', label:'Базы и фильтры', n:4, icon:'<path d="M3.5 5h13l-5 5.6V16l-3-1.6v-3.8L3.5 5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>'},
 {id:'weights', label:'Веса', n:2, icon:'<path d="M10 4.5v11M5 8h10M6.6 8 4.5 13h4.2L6.6 8ZM13.4 8l-2.1 5h4.2l-2.1-5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>'}
];

/* ================================================================
   Состояние
   ================================================================ */
let view = 'structure';
let sel = null;          // {kind, index}
let statFilter = null;
let meterOn = false;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tick = () => '<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5 5 9l4.5-5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const tgl = (on, id) => `<span class="tgl"><input type="checkbox" ${on?'checked':''} ${id?`id="${id}"`:''} onchange="onToggle(this)"/><span class="track"></span><span class="knob">${tick()}</span></span>`;

/* ---------- шапка: сводка ---------- */
function renderStats(){
  $('#stats').innerHTML = STATS.map(s =>
    `<button class="chip ${s.warn?'warn':''} ${statFilter===s.k?'active':''}"
       onclick="setStatFilter('${s.k}')"><b>${s.v}</b>${s.l}</button>`).join('');
}
function setStatFilter(k){
  statFilter = statFilter === k ? null : k;
  if (statFilter) { view = 'structure'; }
  renderStats(); render();
}

/* ---------- рельс ---------- */
function renderRail(){
  $('#rail').innerHTML =
    '<div class="rail-cap">Конфигурация</div>' +
    SECTIONS.map(s => `<button class="rail-item ${view===s.id?'active':''}" onclick="go('${s.id}')">
      <svg viewBox="0 0 20 20" fill="none">${s.icon}</svg><span>${s.label}</span><em>${s.n}</em></button>`).join('');
}
function go(id){ view = id; sel = null; statFilter = null; renderStats(); renderRail(); render(); }

/* ================================================================
   Центральная панель
   ================================================================ */
function render(){
  renderRail();
  const bar = $('#pane-bar'), body = $('#pane-body');
  if (view === 'structure') {
    let rows = QUESTIONS;
    if (statFilter === 'inc') rows = rows.filter(q => q.st !== 'off');
    if (statFilter === 'rev') rows = rows.filter(q => q.st === 'review');
    bar.innerHTML = `
      <h2>Структура</h2><span class="count">${rows.length} из ${QUESTIONS.length}</span>

function qrow(q){
  const i = QUESTIONS.indexOf(q);
  const st = {ok:['','готово'], review:['review','к проверке'], off:['off','вне отчёта']}[q.st];
  return `<tr class="${isSel('structure',i)?'sel':''}" onclick="pick('structure',${i})" data-s="${esc((q.c+' '+q.t).toLowerCase())}">
    <td class="c-drag">⋮⋮</td>
    <td class="c-code"><code>${q.c}</code></td>
    <td class="c-title"><b>${esc(q.t)}</b></td>
    <td class="c-type"><span class="tick ${q.st==='off'?'mut':''}" title="${TYPE_RU[q.k]}"><svg viewBox="0 0 20 20" fill="none">${ICON[q.k]}</svg></span></td>
    <td class="c-n">${q.n}</td>
    <td class="c-base"><span class="base-cell ${q.base?'':'def'}">${q.base?esc(q.base):'стандартная'}</span></td>

function filterRows(v){
  const s = v.trim().toLowerCase();
  document.querySelectorAll('#tb tr').forEach(tr =>
    tr.hidden = !!s && !tr.dataset.s.includes(s));
}
function paneCards(title, n, addLabel, html){
  $('#pane-bar').innerHTML = `<h2>${title}</h2><span class="count">${n}</span><div style="flex:1"></div>

  $('#pane-body').innerHTML = `<div class="cards">${html}

      <svg viewBox="0 0 20 20" fill="none"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      ${addLabel}</button></div>`;
}

function togglePop(e){ e.stopPropagation(); const p=$('#pop'); p.hidden=!p.hidden; }
function closePop(){ $('#pop').hidden = true; }
function dl(what){ closePop(); toast(what+' — готовится'); return false; }
function onToggle(){ /* демо */ }
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  $('#toasts').append(t);
  setTimeout(()=>t.remove(), 2200);
}
document.addEventListener('click', e => { if(!e.target.closest('.pop-wrap')) closePop(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#sheet-root').innerHTML) closeSheet();
  else if (sel) closeInsp();
  else closePop();
});

function toggleMeter(){
  meterOn = !meterOn;
  $('#meter-toggle').classList.toggle('active', meterOn);
  measure();
}
function measure(){
  document.querySelectorAll('.ruler,.meter').forEach(n=>n.remove());
  if (!meterOn) return;
  const firstRow = document.querySelector('#pane-body tbody tr, #pane-body .card');
  const chrome = firstRow ? Math.round(firstRow.getBoundingClientRect().top) : 0;
  const insp = $('#insp');
  let fill = '—';
  if (!insp.hidden) {
    const body = insp.querySelector('.insp-body');
    const used = body.scrollHeight, box = insp.getBoundingClientRect().height;
    fill = Math.round(100 * used / Math.max(1, box - 96)) + '%';
  }
  const sheet = document.querySelector('.sheet');
  const sheetArea = sheet
    ? (Math.round(sheet.getBoundingClientRect().width) + '×' + Math.round(sheet.getBoundingClientRect().height))
    : '—';

  const ruler = document.createElement('div');
  ruler.className = 'ruler';
  ruler.dataset.label = 'хром: ' + chrome + 'px  (было 270)';
  document.body.append(ruler);

  const m = document.createElement('div');
  m.className = 'meter';
  m.innerHTML = `<h4>Замеры макета</h4>
    <dl>
      <dt>до первой строки</dt><dd class="was">270px</dd><dd class="now">${chrome}px</dd>
      <dt>инспектор заполнен</dt><dd class="was">54–82%</dd><dd class="now">${fill}</dd>
      <dt>окно настроек</dt><dd class="was">1377×593</dd><dd class="now">${sheetArea}</dd>
      <dt>высота строки</dt><dd class="was">57px</dd><dd class="now">40px</dd>
      <dt>ярусов хрома</dt><dd class="was">4</dd><dd class="now">2</dd>
    </dl>
    <div class="meter-note">Откройте инспектор и «Настройку отчёта», чтобы заполнить прочерки.</div>`;
  document.body.append(m);
}
window.addEventListener('resize', measure);

renderStats(); render();
</script>
</body>
</html>
