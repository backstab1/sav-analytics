name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  checks:
    name: Линтер, типы и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Установить зафиксированные зависимости
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Проверить типы P0-модулей
        run: >-
          uv run mypy --follow-imports=skip
          src/sav_analytics/api.py
          src/sav_analytics/api_errors.py
          src/sav_analytics/project_models.py
          src/sav_analytics/report_cache.py
          src/sav_analytics/report_jobs.py
          src/sav_analytics/configuration_revision.py
          src/sav_analytics/db
          src/sav_analytics/repository/metadata.py
          src/sav_analytics/repository/store.py
          src/sav_analytics/repository/legacy_import.py
          src/sav_analytics/actor.py
          src/sav_analytics/manage.py
          src/sav_analytics/project_history.py
          src/sav_analytics/jobs
          src/sav_analytics/worker.py
          src/sav_analytics/report_versions.py
          src/sav_analytics/import_jobs.py
          src/sav_analytics/routers/imports.py
          src/sav_analytics/logging_setup.py
          src/sav_analytics/auth
          src/sav_analytics/readiness.py
          src/sav_analytics/core/weight_validation.py
          src/sav_analytics/core/review.py
          src/sav_analytics/api_presentation.py
          src/sav_analytics/core/not_applicable.py
          src/sav_analytics/core/reporting/live.py
          src/sav_analytics/routers/tables.py
          src/sav_analytics/assistant
          src/sav_analytics/routers/assistant.py
          src/sav_analytics/ai_jobs.py
          src/sav_analytics/core/questionnaire.py
          src/sav_analytics/routers/ai.py
          src/sav_analytics/coding_jobs.py
          src/sav_analytics/core/open_text.py
          src/sav_analytics/routers/codeframes.py
          src/sav_analytics/autoreport_jobs.py
          src/sav_analytics/core/autoreport.py
          src/sav_analytics/core/docx_report.py
          src/sav_analytics/routers/autoreport.py
          src/sav_analytics/core/waves.py
          src/sav_analytics/routers/waves.py

      - name: Pytest с покрытием
        run: >-
          uv run pytest
          --cov=sav_analytics
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=junit.xml

      - name: Отчёт о покрытии в сводку запуска
        if: always()
        run: |
          echo '## Покрытие' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" \
            || echo 'Данные о покрытии недоступны: тесты не дошли до конца.' >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-tests
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  postgres:
    name: Тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Каждое хранилище в тестах получает свою базу на этом сервере
      # (tests/conftest.py): проверяется production-диалект — SKIP LOCKED,
      # транзакции записи и миграции.
      SAV_ANALYTICS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Установить зафиксированные зависимости
        run: uv sync --locked --extra dev

      - name: Миграции по цепочке на пустой базе
        env:
          SAV_ANALYTICS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: uv run sav-analytics migrate

      - name: Pytest на PostgreSQL
        run: uv run pytest

  security:
    name: Зависимости, скрипты и compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Известные уязвимости в зафиксированных зависимостях
        run: |
          uv export --locked --no-dev --no-emit-project --output-file requirements.lock
          uvx pip-audit==2.9.0 --strict --disable-pip --requirement requirements.lock

      - name: Shellcheck скриптов эксплуатации
        run: shellcheck scripts/*.sh deploy/*.sh

      - name: Compose-файл собирается
        run: |
          mkdir -p secrets && echo dummy > secrets/backup_passphrase && touch .env
          POSTGRES_PASSWORD=x SAV_DOMAIN=example.test docker compose config --quiet

  browser:
    name: Браузерный сценарий
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Установить зафиксированные зависимости
        run: uv sync --locked --extra dev

      - name: Поставить Chromium
        run: uv run playwright install --with-deps chromium

      - name: Сквозной сценарий аналитика
        run: uv run pytest -m browser --tracing=retain-on-failure --output=playwright-artifacts

      - name: Сохранить трассировку упавшего сценария
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: playwright-artifacts/
          retention-days: 14

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Собрать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sav-analytics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Процесс в образе — не root
        run: test "$(docker run --rm sav-analytics:ci id -u)" != "0"

      - name: Сканирование образа на уязвимости
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sav-analytics:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Проверить, что контейнер поднимается
        run: |
          docker run --rm --detach --name sav-analytics-ci \
            --publish 8000:8000 \
            --env SAV_ANALYTICS_DATA_DIR=/tmp/data \
            sav-analytics:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              echo
              echo "Контейнер ответил на /api/health с попытки $attempt."
              docker stop sav-analytics-ci
              exit 0
            fi
            sleep 2
          done

          echo "Контейнер не ответил на /api/health за 60 секунд." >&2
          docker logs sav-analytics-ci >&2
          docker stop sav-analytics-ci
          exit 1
